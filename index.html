<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DropPlan</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='3' y='17' width='6' height='12' rx='1.5' fill='%2316a34a'/><rect x='13' y='10' width='6' height='19' rx='1.5' fill='%23eab308'/><rect x='23' y='4' width='6' height='25' rx='1.5' fill='%23dc2626'/></svg>">
</head>
<body>
  <header class="topbar">
    <div class="brand">DropPlan</div>
    <div class="mode" id="mode"></div>
    <div class="cal-status" id="cal-status" hidden>
      <button class="icon-btn" id="btn-cal-refresh" title="Kalender jetzt aktualisieren">⟳</button>
      <span id="cal-status-text"></span>
    </div>
    <div class="sync" id="sync"></div>
    <button class="icon-btn" id="btn-settings" title="Einstellungen" hidden>⚙︎</button>
  </header>

  <!-- Verbinden mit Dropbox -->
  <section class="connect" id="connect" hidden>
    <div class="connect-card">
      <h1>DropPlan</h1>
      <p>Kapazitätsplanung für Aufgaben. Deine Daten liegen als Dateien in deiner eigenen Dropbox, im Ordner <code>Apps/…</code>.</p>
      <button class="primary" id="btn-connect">Mit Dropbox verbinden</button>
      <p class="hint" id="connect-hint"></p>
    </div>
  </section>

  <main class="app" id="app" hidden>
    <section class="panel tasks">
      <button class="strip" id="btn-expand" title="Liste ausklappen">
        <span class="chevron">›</span><span class="strip-label">Aufgaben</span>
      </button>
      <form class="new-task" id="new-task" autocomplete="off">
        <button type="button" class="icon-btn chevron-btn" id="btn-collapse" title="Liste einklappen">‹</button>
        <input name="title" placeholder="Neue Aufgabe …" aria-label="Neue Aufgabe">
        <input name="estimate" class="estimate-input" placeholder="Std." inputmode="decimal" aria-label="Geschätzte Dauer in Stunden" title="Geschätzte Dauer in Stunden (optional), z. B. 3 oder 2,5">
        <button class="primary" type="submit">+</button>
      </form>
      <div class="filters" id="filters"></div>
      <ul class="task-list" id="task-list"></ul>
    </section>

    <div class="splitter" id="splitter" title="Breite der Liste ziehen"></div>

    <section class="panel calendar">
      <div class="cal-toolbar">
        <div class="seg" role="group">
          <button data-view="week">Woche</button>
          <button data-view="month">Monat</button>
        </div>
        <button class="icon-btn" data-nav="-1" title="Zurück">‹</button>
        <button data-nav="0">Heute</button>
        <button class="icon-btn" data-nav="1" title="Weiter">›</button>
        <h2 id="cal-title"></h2>
      </div>
      <div class="cal-body" id="cal-body"></div>
    </section>
  </main>

  <!-- Aufgabe bearbeiten -->
  <dialog id="task-dialog">
    <form method="dialog" id="task-form" autocomplete="off">
      <button type="button" class="close-x" data-close title="Schließen" aria-label="Schließen">×</button>
      <input name="title" class="title-input" placeholder="Titel" required autofocus>
      <div class="status-line" id="task-status"></div>
      <label>Notiz<textarea name="notes" rows="5"></textarea></label>
      <label>Tags <small>mit Komma trennen, z. B. backlog, ready</small><input name="tags" list="tag-list"></label>
      <div class="field"><span class="field-label">Farbe</span><div class="color-pick" id="task-colors"></div></div>
      <datalist id="tag-list"></datalist>
      <div class="row">
        <label>Schätzung (Std.)<input name="estimate" inputmode="decimal" placeholder="z. B. 2,5"></label>
        <label>Deadline<input type="date" name="deadline"></label>
        <label>Wiedervorlage<input type="date" name="followUp"></label>
      </div>
      <div class="task-bookings" id="task-bookings"></div>
      <div class="dialog-actions">
        <button type="button" class="danger" id="btn-delete-task">Löschen</button>
        <button type="button" id="btn-archive-task">Archivieren</button>
        <span class="filter-spacer"></span>
        <button value="close" class="primary">Fertig</button>
      </div>
    </form>
  </dialog>

  <!-- Einstellungen -->
  <dialog id="settings-dialog">
    <form method="dialog" id="settings-form">
      <button type="button" class="close-x" data-close title="Schließen" aria-label="Schließen">×</button>
      <h3>Einstellungen</h3>
      <label>Standard-Dauer beim Einplanen (Minuten)<input type="number" name="defaultMinutes" min="5" step="5" autofocus></label>
      <fieldset>
        <legend>Kapazität pro Wochentag (Stunden)</legend>
        <div class="weekday-caps" id="weekday-caps"></div>
      </fieldset>
      <div class="row">
        <label>Wochenansicht zeigt von (Uhr)<input type="number" name="coreStart" min="0" max="23"></label>
        <label>bis (Uhr)<input type="number" name="coreEnd" min="1" max="24"></label>
      </div>
      <fieldset class="cal-settings">
        <legend>Kalender im Hintergrund</legend>
        <label class="inline">Aktualisieren alle <input type="number" name="refreshMinutes" min="1" max="120"> Minuten</label>
        <div class="cal-source">
          <label class="check"><input type="checkbox" name="googleEnabled"> <b>Google Calendar</b></label>
          <div class="cal-source-body" id="google-settings"></div>
        </div>
        <div class="cal-source">
          <label class="check"><input type="checkbox" name="icalEnabled"> <b>iCal-Abos</b> <small>(Apple iCloud, Google, Outlook …)</small></label>
          <div class="cal-source-body" id="ical-settings"></div>
        </div>
      </fieldset>
      <div class="dialog-actions">
        <button type="button" class="danger" id="btn-disconnect">Dropbox trennen</button>
        <span class="filter-spacer"></span>
        <button value="cancel" formnovalidate>Abbrechen</button>
        <button value="save" class="primary">Speichern</button>
      </div>
    </form>
  </dialog>

  <div class="popover" id="popover" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
